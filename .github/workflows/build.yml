name: Compilar Firmware Raspberry Pi Pico

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio principal (en la raíz)
      uses: actions/checkout@v4

    - name: Descargar TinyUSB como submódulo o clonar en la ruta correcta
      uses: actions/checkout@v4
      with:
        repository: hathach/tinyusb
        path: hw/bsp/../../../../tinyusb # Ajustamos la ruta para que coincida

    - name: Instalar dependencias (CMake, Ninja y Compilador ARM)
      run: |
        sudo apt update
        sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 ninja-build

    - name: Descargar y configurar Pico SDK
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git /home/runner/pico-sdk
        cd /home/runner/pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=/home/runner/pico-sdk" >> $GITHUB_ENV

    - name: Reestructurar TinyUSB a la ruta exacta ../../../hw/bsp
      run: |
        # El CMakeLists.txt está en la raíz, sube 3 niveles y busca hw/bsp/family_support.cmake
        # Por lo tanto, tinyusb debe quedar en la carpeta padre o en la ruta esperada relativa al proyecto.
        # Vamos a mover todo el contenido de tinyusb a la ruta relativa correcta desde la raíz:
        mkdir -p hw/bsp
        # Si se descargó en otro lado, lo movemos:
        if [ -d "tinyusb" ]; then
          mv tinyusb/* hw/bsp/
          rmdir tinyusb
        fi

    - name: Configurar CMake y Compilar
      run: |
        mkdir build
        cd build
        cmake -G "Ninja" ..
        ninja

    - name: Guardar archivo .uf2 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-uf2
        path: build/**/*.uf2
