name: Compilar Firmware Raspberry Pi Pico

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio principal
      uses: actions/checkout@v4
      with:
        path: pico-pcm1808-usb-audio

    - name: Descargar TinyUSB (para satisfacer las dependencias de BSP)
      uses: actions/checkout@v4
      with:
        repository: hathach/tinyusb
        path: tinyusb

    - name: Instalar dependencias (CMake, Ninja y Compilador ARM)
      run: |
        sudo apt update
        sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 ninja-build

    - name: Descargar y configurar Pico SDK
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git /home/runner/pico-sdk
        cd /home/runner/pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=/home/runner/pico-sdk" >> $GITHUB_ENV

    - name: Reestructurar carpetas para que CMake encuentre TinyUSB
      run: |
        # Mueve tinyusb al nivel superior que el CMakeLists.txt del autor espera (../../../hw/bsp/...)
        mkdir -p hw
        mv tinyusb hw/bsp

    - name: Configurar CMake y Compilar
      run: |
        cd pico-pcm1808-usb-audio
        mkdir build
        cd build
        cmake -G "Ninja" ..
        ninja

    - name: Guardar archivo .uf2 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-uf2
        path: pico-pcm1808-usb-audio/build/**/*.uf2
