name: Build Pico Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            git \
            python3

      - name: Clone Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          cd $HOME/pico-sdk
          git submodule update --init

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/../pico-sdk
        run: |
          mkdir build
          cd build
          cmake .. \
            -DPICO_SDK_PATH=$HOME/pico-sdk \
            -G Ninja

      - name: Build
        run: |
          cd build
          ninja

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico-firmware
          path: |
            build/**/*.uf2
            build/**/*.elf
            build/**/*.bin
            build/**/*.hex
