name: Compilar Firmware Raspberry Pi Pico

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar TinyUSB (estructura base)
      uses: actions/checkout@v4
      with:
        repository: hathach/tinyusb
        ref: master

    - name: Clonar tu repositorio dentro de los ejemplos de TinyUSB
      uses: actions/checkout@v4
      with:
        path: examples/device/pico-pcm1808-usb-audio

    - name: Instalar dependencias (CMake, Ninja y Compilador ARM)
      run: |
        sudo apt update
        sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 ninja-build

    - name: Descargar y configurar Pico SDK
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git /home/runner/pico-sdk
        cd /home/runner/pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=/home/runner/pico-sdk" >> $GITHUB_ENV

    - name: Configurar CMake y Compilar
      run: |
        cd examples/device/pico-pcm1808-usb-audio
        mkdir build
        cd build
        # AQUÍ ESTÁ EL CAMBIO: Añadimos -DBOARD=raspberry_pi_pico
        cmake -G "Ninja" -DBOARD=raspberry_pi_pico ..
        ninja

    - name: Guardar archivo .uf2 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-uf2
        path: examples/device/pico-pcm1808-usb-audio/build/**/*.uf2
