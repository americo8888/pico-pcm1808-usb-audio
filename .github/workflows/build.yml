name: Compilar Firmware Raspberry Pi Pico

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio principal (en la raíz)
      uses: actions/checkout@v4

    - name: Clonar TinyUSB en la ruta relativa exacta
      run: |
        # El CMakeLists.txt busca en ../../../hw/bsp/family_support.cmake desde la carpeta raíz.
        # Esto significa que necesita encontrar hw/bsp a tres niveles de distancia o en la estructura superior.
        # Clonamos TinyUSB directamente y lo movemos a la ruta que espera.
        git clone https://github.com/hathach/tinyusb.git temp_tinyusb
        mkdir -p hw/bsp
        cp -r temp_tinyusb/* hw/bsp/
        rm -rf temp_tinyusb

    - name: Instalar dependencias (CMake, Ninja y Compilador ARM)
      run: |
        sudo apt update
        sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 ninja-build

    - name: Descargar y configurar Pico SDK
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git /home/runner/pico-sdk
        cd /home/runner/pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=/home/runner/pico-sdk" >> $GITHUB_ENV

    - name: Configurar CMake y Compilar
      run: |
        mkdir build
        cd build
        cmake -G "Ninja" ..
        ninja

    - name: Guardar archivo .uf2 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-uf2
        path: build/**/*.uf2
